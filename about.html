<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fabric — About</title>
<meta name="description" content="Why we started Fabric, and who it's for: engineers, researchers and hobbyists.">

<!-- self-host these before shipping to Pages -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,100..600,0..100,0..1;1,9..144,100..600,0..100,0..1&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root{
  --teal-void:#091F1F;  --teal:#102B2B;  --teal-lift:#1B3A3A;
  --paper:#E4DFC4;       --rule:#C8C09A;   --ink:#2A2A22;  --ink-soft:#5C5B49;
  --terra:#C4652C;
  --lilac:#CFB3EB;         --lilac-pale:#E7D6F5;  --lilac-deep:#8A70A9;

  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --disp:"Fraunces",Georgia,serif;
  --gut:clamp(1.25rem,4vw,3.5rem);
}
*,*::before,*::after{box-sizing:border-box}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

body{margin:0;background:var(--teal-void);color:var(--paper);
     font:400 1.0625rem/1.7 var(--mono);-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding-inline:var(--gut)}
.band{padding-block:clamp(3.5rem,8vw,7rem);position:relative}
.band--teal{background:var(--teal)}

/* dot grid, from the app viewports */
.band > .wrap{position:relative;z-index:1}
.dots::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(var(--teal-lift) 1.2px,transparent 1.2px);
  background-size:26px 26px;
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 20%,#000 80%,transparent);
          mask-image:linear-gradient(180deg,transparent,#000 20%,#000 80%,transparent)}

/* type roles */
.display{font-family:var(--disp);font-weight:300;
  font-variation-settings:"opsz" 120,"SOFT" 40,"WONK" 1;
  line-height:1.03;letter-spacing:-.01em;margin:0;color:var(--lilac-pale)}
.eyebrow{font-size:.8125rem;letter-spacing:.22em;text-transform:uppercase;
  color:var(--lilac);font-weight:500;margin:0 0 1.1rem}
h1.display{font-size:clamp(3rem,8vw,5.6rem)}
h2.display{font-size:clamp(2.1rem,4.2vw,3rem)}
em{font-style:italic;color:var(--lilac);font-variation-settings:"opsz" 144,"SOFT" 60,"WONK" 1}

/* the paper slab — always the functional surface. the accent never lands here. */
.slab{background:var(--paper);color:var(--ink);border-radius:3px;
  padding:clamp(1.5rem,3.5vw,2.5rem);
  box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 18px 40px -24px #000}
.slab p{color:var(--ink-soft);max-width:60ch}
.tag{display:inline-block;background:#D6D0AE;color:var(--ink);font-size:.875rem;
  letter-spacing:.06em;padding:.35rem .9rem;border-radius:4px 4px 0 0;position:relative;top:1px}

.btn{display:inline-flex;align-items:center;padding:.72rem 1.3rem;border-radius:3px;
  font:400 .9375rem var(--mono);text-decoration:none;cursor:pointer;
  border:1px solid var(--lilac-deep);color:var(--lilac-pale);background:none;
  transition:background .2s,color .2s,border-color .2s}
.btn:hover{background:var(--lilac);color:var(--teal-void);border-color:var(--lilac)}
.btn--solid{background:var(--lilac);color:var(--teal-void);border-color:var(--lilac)}
:focus-visible{outline:2px solid var(--lilac);outline-offset:3px}

header{position:sticky;top:0;z-index:20;background:rgba(9,31,31,.86);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--teal-lift)}
.bar{display:flex;align-items:center;justify-content:space-between;height:62px}
.brand{display:flex;align-items:center;gap:.7rem;text-decoration:none}
.brand img{height:28px;width:auto;display:block}
.brand span{font-family:var(--disp);font-weight:400;
  font-variation-settings:"opsz" 40,"SOFT" 30,"WONK" 1;
  font-size:1.625rem;letter-spacing:.18em;color:var(--paper)}
header .btn{white-space:nowrap}
@media (max-width:480px){
  .brand{gap:.5rem}
  .brand img{height:22px}
  .brand span{font-size:1.25rem;letter-spacing:.12em}
  header .btn{padding:.5rem .8rem;font-size:.8125rem}
}
@media (max-width:350px){
  .bar{gap:.6rem}
  .brand{gap:.4rem}
  .brand img{height:18px}
  .brand span{font-size:1.0625rem;letter-spacing:.08em}
  header .btn{padding:.45rem .6rem;font-size:.75rem}
}

footer{border-top:1px solid var(--teal-lift);padding-block:2.25rem;
  font-size:.8125rem;color:#7E8C8C}
footer a{color:inherit;text-decoration:none}
footer a:hover{color:var(--paper)}

/* about — one paper slab per statement, styled like the demo console.
   Replace each placeholder (search: -text). Line breaks are kept. */
.about{display:grid;gap:clamp(2.5rem,6vw,4rem)}
.about__slab{margin:0}
.slab .about__body{margin:0;color:var(--ink);white-space:pre-wrap;
  font-size:clamp(1.1rem,2.4vw,1.5rem);line-height:1.55;max-width:60ch}
.slab .about__body + .about__body{margin-top:1em}
/* several cards under one heading */
.about__group{display:grid;gap:1.75rem}
</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <a class="brand" href="index.html">
      <img src="logo.png" alt="" width="82" height="28">
      <span>Fabric</span>
    </a>
    <a class="btn" href="index.html#waitlist">Join the waitlist</a>
  </div>
</header>

<main id="top">

  <section class="band dots">
    <div class="wrap">
      <p class="eyebrow">About</p>
      <h1 class="display">About <em>Fabric</em>.</h1>
    </div>
  </section>

  <!-- STATEMENTS — same shape as the demo section. Replace each
       placeholder word with the real statement. -->
  <section class="band band--teal">
    <div class="wrap about">

      <div id="story">
        <p class="eyebrow">Why we started Fabric</p>
        <span class="tag">story.md</span>
        <figure class="slab about__slab"><p class="about__body">We started Fabric because we're researchers, and we kept hitting the same problems. Variables were scattered and disorganized. Every step needed a different program, and each one handled things its own way. Setups didn't carry over from simulation to manufacturing. And it was hard to trace results back to the variables that defined the problem in the first place.</p></figure>
      </div>

      <div id="who">
        <p class="eyebrow">Who it's for</p>
        <div class="about__group">
          <div id="researchers">
            <span class="tag">researchers.md</span>
            <figure class="slab about__slab"><p class="about__body">Fabric manages your data for you. One file can hold every simulation run or experiment, each stamped with the date and time and a record of exactly what was done, and you can query all of it.</p></figure>
          </div>
          <div id="engineers">
            <span class="tag">engineers.md</span>
            <figure class="slab about__slab"><p class="about__body">The variables that define your design carry through from simulation to manufacturing, so every result traces back to them. Soon you'll be able to write full reports straight from those variables too.</p></figure>
          </div>
          <div id="hobbyists">
            <span class="tag">hobbyists.md</span>
            <figure class="slab about__slab"><p class="about__body">Say someone models a screw in Fabric and shares it. You can import that screw, change the numbers to fit your build, and end up with a screw made to your exact specs. The same works for whole systems.</p></figure>
          </div>
        </div>
      </div>

      <div id="promise">
        <p class="eyebrow">Our promise</p>
        <span class="tag">promise.md</span>
        <figure class="slab about__slab"><p class="about__body">Buying Fabric is like buying a well-made tool that you keep forever. There will never be a subscription.</p></figure>
      </div>

      <div>
        <a class="btn btn--solid" href="index.html#waitlist">Join the waitlist</a>
      </div>

    </div>
  </section>

</main>

<footer>
  <div class="wrap" style="display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap">
    <span>Fabric</span>
    <span><a href="index.html">Home</a></span>
  </div>
</footer>

</body>
</html>
