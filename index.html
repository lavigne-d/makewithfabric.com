<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fabric — a scriptable engineering notebook with CAD built in</title>
<meta name="description" content="Describe parts in plain text and watch Fabric build them. Scriptable CAD that stores on disk, rebuilds exactly, and makes infinite variations from one file.">

<!-- self-host these before shipping to Pages -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,100..600,0..100,0..1;1,9..144,100..600,0..100,0..1&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root{
  --teal-void:#091F1F;  --teal:#102B2B;  --teal-lift:#1B3A3A;
  --paper:#E4DFC4;       --rule:#C8C09A;   --ink:#2A2A22;  --ink-soft:#5C5B49;
  --terra:#C4652C;
  --lilac:#CFB3EB;         --lilac-pale:#E7D6F5;  --lilac-deep:#8A70A9;

  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --disp:"Fraunces",Georgia,serif;
  --gut:clamp(1.25rem,4vw,3.5rem);
}
*,*::before,*::after{box-sizing:border-box}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

body{margin:0;background:var(--teal-void);color:var(--paper);
     font:400 1.0625rem/1.7 var(--mono);-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding-inline:var(--gut)}
.band{padding-block:clamp(3.5rem,8vw,7rem);position:relative}
.band--teal{background:var(--teal)}

/* dot grid, from the app viewports */
.band > .wrap{position:relative;z-index:1}
.dots::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(var(--teal-lift) 1.2px,transparent 1.2px);
  background-size:26px 26px;
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 20%,#000 80%,transparent);
          mask-image:linear-gradient(180deg,transparent,#000 20%,#000 80%,transparent)}

/* type roles */
.display{font-family:var(--disp);font-weight:300;
  font-variation-settings:"opsz" 120,"SOFT" 40,"WONK" 1;
  line-height:1.03;letter-spacing:-.01em;margin:0;color:var(--lilac-pale)}
.eyebrow{font-size:.8125rem;letter-spacing:.22em;text-transform:uppercase;
  color:var(--lilac);font-weight:500;margin:0 0 1.1rem}
.eyebrow--ink{color:var(--ink-soft)}
h1.display{font-size:clamp(3rem,8vw,5.6rem)}
h2.display{font-size:clamp(2.1rem,4.2vw,3rem)}
em{font-style:italic;color:var(--lilac);font-variation-settings:"opsz" 144,"SOFT" 60,"WONK" 1}

/* the paper slab — always the functional surface. the accent never lands here. */
.slab{background:var(--paper);color:var(--ink);border-radius:3px;
  padding:clamp(1.5rem,3.5vw,2.5rem);
  box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 18px 40px -24px #000}
.slab--ruled{background-image:repeating-linear-gradient(180deg,transparent 0 31px,var(--rule) 31px 32px);
  background-position:0 10px}
.slab p{color:var(--ink-soft);max-width:60ch}
.tag{display:inline-block;background:#D6D0AE;color:var(--ink);font-size:.875rem;
  letter-spacing:.06em;padding:.35rem .9rem;border-radius:4px 4px 0 0;position:relative;top:1px}

.btn{display:inline-flex;align-items:center;padding:.72rem 1.3rem;border-radius:3px;
  font:400 .9375rem var(--mono);text-decoration:none;cursor:pointer;
  border:1px solid var(--lilac-deep);color:var(--lilac-pale);background:none;
  transition:background .2s,color .2s,border-color .2s}
.btn:hover{background:var(--lilac);color:var(--teal-void);border-color:var(--lilac)}
.btn--solid{background:var(--lilac);color:var(--teal-void);border-color:var(--lilac)}
:focus-visible{outline:2px solid var(--lilac);outline-offset:3px}

header{position:sticky;top:0;z-index:20;background:rgba(9,31,31,.86);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--teal-lift)}
.bar{display:flex;align-items:center;justify-content:space-between;height:62px}
.brand{display:flex;align-items:center;gap:.7rem;text-decoration:none}
.brand svg{width:26px;height:26px}
.brand span{font-family:var(--disp);font-weight:100;
  font-variation-settings:"opsz" 40,"SOFT" 30,"WONK" 1;
  font-size:1.625rem;letter-spacing:.18em;color:var(--lilac-pale)}

.lede{max-width:56ch;font-size:1.1875rem;color:#CFCBB2;margin:1.6rem 0 2rem}
/* proof row: three affirmatives, dot-separated */
.proof{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;
  gap:.35rem clamp(1.75rem,5vw,3.25rem);margin:0;text-align:center;
  font-size:.9375rem;letter-spacing:.1em;color:#7E8C8C}
.proof span{position:relative}
.proof span + span::before{content:"·";position:absolute;
  left:calc(-1 * clamp(1.75rem,5vw,3.25rem) / 2);transform:translateX(-50%);
  color:#889898}
@media (max-width:560px){
  .proof{flex-direction:column;gap:.4rem}
  .proof span + span::before{display:none}
}

/* waitlist form */
.waitlist{display:flex;gap:.6rem;flex-wrap:wrap;align-items:stretch;max-width:30rem;margin-top:.5rem}
.waitlist input[type=email]{
  flex:1 1 15rem;min-width:0;font:400 .9375rem var(--mono);
  padding:.72rem .95rem;border-radius:3px;
  background:rgba(228,223,196,.06);color:var(--paper);
  border:1px solid var(--teal-lift);transition:border-color .2s}
.waitlist input[type=email]::placeholder{color:#6E7C7C}
.waitlist input[type=email]:focus{border-color:var(--lilac-deep);outline:none}
.waitlist input[type=email]:focus-visible{outline:2px solid var(--lilac);outline-offset:2px}
.waitlist .btn{border:none}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.formnote{font-size:.8125rem;color:#7E8C8C;margin:.9rem 0 0;min-height:1.2em}
.formnote[data-state="ok"]{color:var(--lilac)}
.formnote[data-state="err"]{color:var(--terra)}
.waitlist[hidden]{display:none}

/* confirmation, sits where the form was */
.waitlist-done{display:flex;align-items:center;gap:.6rem;margin-top:.5rem;
  font-size:1.0625rem;color:var(--lilac-pale)}
.waitlist-done[hidden]{display:none}
.waitlist-done::before{content:"✓";color:var(--lilac)}

footer{border-top:1px solid var(--teal-lift);padding-block:2.25rem;
  font-size:.8125rem;color:#7E8C8C}
footer a{color:inherit;text-decoration:none}
footer a:hover{color:var(--lilac)}

/* placeholder marker — delete the class as you fill each one in */
.todo{border-bottom:1px dashed var(--terra)}

/* ------------------------------------------------------------------
   DEMO SLAB
   .demo__stage is a fixed frame with a swappable occupant. Today it
   holds a <video>; later it holds the live interactive session. Swap
   the child element — the frame, chrome and copy do not move.
   ------------------------------------------------------------------ */
.demo{margin:0}
.demo__stage{position:relative;aspect-ratio:16/9;overflow:hidden;
  border-radius:2px 2px 0 0;background:var(--teal-void)}
.demo__stage > video,
.demo__stage > iframe,
.demo__stage > canvas{position:absolute;inset:0;width:100%;height:100%;
  border:0;display:block;object-fit:cover}

/* empty stage: dot grid only, until an asset is wired up */
.demo__stage[data-demo-state="placeholder"]{
  background-image:radial-gradient(var(--teal-lift) 1.2px,transparent 1.2px);
  background-size:26px 26px}

/* the crossfading frame */
.demo__frame{opacity:0;transition:opacity .35s ease}
.demo__frame[data-shown="true"]{opacity:1}

/* ------------------------------------------------------------------
   CONSOLE — flush under the stage so the two read as one screen.
   ------------------------------------------------------------------ */
.demo__console{background:var(--teal-void);border-radius:0 0 2px 2px;
  padding:clamp(.9rem,2.2vw,1.25rem);font-size:.9375rem;line-height:1.65;
  box-shadow:0 0 0 1px rgba(42,42,34,.28)}

/* task list */
.demo__tasks{list-style:none;margin:0 0 .9rem;padding:0 0 .9rem;
  border-bottom:1px solid var(--teal-lift);display:grid;gap:.3rem}
.demo__tasks li{display:flex;gap:.6rem;align-items:baseline;color:#5E6D6D}
.demo__tasks li::before{content:"•";flex:none;width:1ch;color:#4C5C5C}
.demo__tasks li[data-state="done"]{color:#6E7C7C}
.demo__tasks li[data-state="done"]::before{content:"✓";color:var(--lilac-deep)}
.demo__tasks li[data-state="now"]{color:var(--paper)}
.demo__tasks li[data-state="now"]::before{content:"›";color:var(--lilac)}
.demo__tasks code{font:inherit;color:var(--lilac-pale);background:rgba(207,179,235,.12);
  border-radius:2px;padding:.05rem .4rem;margin-left:.15rem}
.demo__tasks li[data-state="todo"] code{visibility:hidden}

/* output history */
.demo__out{margin:0;max-height:9.5rem;overflow-y:auto;overscroll-behavior:contain}
.demo__out p{margin:0;color:#8B9B9B;white-space:pre-wrap;word-break:break-word}
.demo__out p[data-kind="cmd"]{color:var(--paper)}
.demo__out p[data-kind="err"]{color:var(--terra)}
.demo__out p[data-kind="done"]{color:var(--lilac)}
.demo__out:empty{display:none}

/* prompt line */
.demo__line{display:flex;align-items:center;gap:.55rem;margin-top:.55rem}
.demo__line::before{content:">";color:var(--lilac);flex:none}
.demo__input{flex:1 1 auto;min-width:0;background:none;border:0;padding:.15rem 0;
  font:inherit;font-family:var(--mono);color:var(--paper);caret-color:var(--lilac)}
.demo__input:focus{outline:none}
.demo__line:focus-within{outline:2px solid var(--lilac);outline-offset:4px;border-radius:2px}
.demo__input::placeholder{color:#4C5C5C}

/* finish state */
.demo__end{display:none;margin-top:.9rem;gap:.7rem;flex-wrap:wrap;align-items:center}
.demo__console[data-done="true"] .demo__end{display:flex}
.demo__console[data-done="true"] .demo__line{display:none}
.demo__reset{background:none;border:0;padding:0;cursor:pointer;font:inherit;
  font-family:var(--mono);font-size:.8125rem;color:#7E8C8C;text-decoration:underline;
  text-underline-offset:3px}
.demo__reset:hover{color:var(--lilac)}
</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <a class="brand" href="#top">
      <!-- placeholder mark until the real logo lands -->
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <ellipse cx="20" cy="20" rx="18" ry="10" fill="none" stroke="#CFB3EB" stroke-width="1.4"/>
        <ellipse cx="20" cy="20" rx="7" ry="3.8" fill="none" stroke="#E7D6F5" stroke-width="1.4"/>
      </svg>
      <span>Fabric</span>
    </a>
    <a class="btn" href="#waitlist">Make with Fabric</a>
  </div>
</header>

<main id="top">

  <!-- HERO -->
  <section class="band dots">
    <div class="wrap">
      <p class="eyebrow">Computer Aided Design</p>
      <h1 class="display"><em>Spell</em> systems into reality.</h1>
      <p class="lede">
        Script models with dynamic constraints. 
      </p>
      <form class="waitlist" id="waitlist" novalidate>
        <label class="hp" for="company">Company (leave blank)</label>
        <input class="hp" type="text" id="company" name="company" tabindex="-1" autocomplete="off">
        <input type="email" name="email" id="email" required autocomplete="email"
               placeholder="Your email" aria-label="Email address">
        <button class="btn btn--solid" type="submit" id="wlBtn">Join the waitlist</button>
      </form>
      <p class="waitlist-done" id="wlDone" role="status" aria-live="polite" hidden>Check your inbox</p>
      <p class="formnote" id="wlNote" role="status" aria-live="polite"></p>
    </div>
  </section>


  <!-- DEMO SLAB -->
  <section class="band band--teal">
    <div class="wrap">
      <span class="tag">demo.JSON</span>
      <figure class="slab demo">
        <!-- swap point: replace the child of .demo__stage with the live
             session when it's ready, and set data-demo-state="live" -->
        <!-- stage: swap the child for the live session later -->
        <div class="demo__stage" data-demo-state="placeholder" id="demoStage">
          <img class="demo__frame" id="demoFrame" alt="" aria-hidden="true">
        </div>

        <div class="demo__console" id="demoConsole" data-done="false">
          <ol class="demo__tasks" id="demoTasks"></ol>
          <div class="demo__out" id="demoOut" role="log" aria-live="polite"></div>

          <label class="demo__line" for="demoInput">
            <span class="hp">Type the command shown above</span>
            <input class="demo__input" id="demoInput" type="text"
                   autocomplete="off" autocorrect="off" autocapitalize="off"
                   spellcheck="false" placeholder="type the command">
          </label>

          <div class="demo__end">
            <a class="btn btn--solid" href="#waitlist" id="demoCta">Join the waitlist</a>
            <button class="demo__reset" id="demoReset" type="button">run it again</button>
          </div>
        </div>
      </figure>
    </div>
  </section>

  <!-- PROOF ROW -->
  <section class="band dots">
    <div class="wrap">
      <p class="proof">
        <span>scriptable language</span>
        <span>on-disk storage</span>
        <span>infinite variations</span>
      </p>
    </div>
  </section>

</main>

<footer>
  <div class="wrap" style="display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap">
    <span>Fabric</span>
    <span><a href="#">GitHub</a> · <a href="#">Docs</a></span>
  </div>
</footer>

<script>
/* ------------------------------------------------------------------
   Interactive demo.

   STEPS is the only thing to edit when real content exists: the command
   the reader must type, the instruction shown, what prints back, and the
   frame that appears. Nothing else in this file names a command.
   ------------------------------------------------------------------ */
const STEPS = [
  { cmd:   'PLACEHOLDER_COMMAND_1',                       // TODO: real syntax
    say:   'Start a new part',
    out:   ['placeholder response line'],                 // TODO: real output
    frame: 'assets/demo/step-1.webp' },
  { cmd:   'PLACEHOLDER_COMMAND_2',
    say:   'Give it a dimension',
    out:   ['placeholder response line'],
    frame: 'assets/demo/step-2.webp' },
  { cmd:   'PLACEHOLDER_COMMAND_3',
    say:   'Change one number and rebuild',
    out:   ['placeholder response line'],
    frame: 'assets/demo/step-3.webp' },
];

const DONE_LINE = 'That is the whole loop. Every part you make works this way.';

/* Single error surface. Swap these strings for the real messages and the
   demo speaks in the software's voice everywhere at once. */
function errorFor(input, step){
  const typed  = input.split(/\s+/)[0];
  const wanted = step.cmd.split(/\s+/)[0];
  return typed === wanted
    ? 'fabric: ' + typed + ': invalid arguments'          // TODO: real message
    : 'fabric: command not found: ' + typed;              // TODO: real message
}

(function(){
  const stage   = document.getElementById('demoStage');
  const frame   = document.getElementById('demoFrame');
  const tasks   = document.getElementById('demoTasks');
  const out     = document.getElementById('demoOut');
  const input   = document.getElementById('demoInput');
  const console_= document.getElementById('demoConsole');
  const reset   = document.getElementById('demoReset');
  const cta     = document.getElementById('demoCta');
  if (!stage || !input) return;

  let at = 0;

  function paintTasks(){
    tasks.innerHTML = '';
    STEPS.forEach((step, i) => {
      const li = document.createElement('li');
      li.dataset.state = i < at ? 'done' : i === at ? 'now' : 'todo';
      li.append(step.say + ' ');
      const code = document.createElement('code');
      code.textContent = step.cmd;
      li.append(code);
      tasks.append(li);
    });
  }

  function say(text, kind){
    const p = document.createElement('p');
    if (kind) p.dataset.kind = kind;
    p.textContent = text;
    out.append(p);
    out.scrollTop = out.scrollHeight;
  }

  /* Frames are an enhancement: if the image is missing the stage simply
     keeps its dot grid and the demo still runs end to end. */
  function show(src){
    if (!src) return;
    const img = new Image();
    img.onload = () => {
      frame.src = src;
      frame.dataset.shown = 'true';
      stage.dataset.demoState = 'ready';
    };
    img.src = src;
  }
  function preload(i){ if (STEPS[i] && STEPS[i].frame) new Image().src = STEPS[i].frame; }

  function advance(){
    const step = STEPS[at];
    (step.out || []).forEach(line => say(line));
    show(step.frame);
    at++;
    preload(at);
    paintTasks();
    if (at >= STEPS.length){
      say(DONE_LINE, 'done');
      console_.dataset.done = 'true';
    }
  }

  function submit(){
    const typed = input.value.trim();
    if (!typed) return;
    say('> ' + typed, 'cmd');
    input.value = '';
    if (typed === STEPS[at].cmd) advance();
    else say(errorFor(typed, STEPS[at]), 'err');
  }

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter'){ e.preventDefault(); submit(); }
  });

  reset.addEventListener('click', () => {
    at = 0;
    out.innerHTML = '';
    frame.dataset.shown = 'false';
    frame.removeAttribute('src');
    stage.dataset.demoState = 'placeholder';
    console_.dataset.done = 'false';
    paintTasks();
    preload(0);
    input.focus();
  });

  /* the ask, at the moment it lands */
  cta.addEventListener('click', () => {
    const email = document.getElementById('email');
    if (email) setTimeout(() => email.focus({ preventScroll: true }), 500);
  });

  paintTasks();
  preload(0);
})();

/* ------------------------------------------------------------------
   Waitlist. Paste your provider's form endpoint below and it works.
   Public by design — this URL is visible in the page source, which is
   fine: it only accepts submissions, it can't read the list.
   ------------------------------------------------------------------ */
const ENDPOINT = ""; // e.g. https://eocampaign1.com/form/xxxx  |  https://buttondown.com/api/emails/embed-subscribe/fabric

const form = document.getElementById('waitlist');
const note = document.getElementById('wlNote');
const btn  = document.getElementById('wlBtn');

function say(msg, state){ note.textContent = msg; note.dataset.state = state || ''; }

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = form.email.value.trim();

  if (form.company.value) return;                      // honeypot: bot filled it
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return say('That address looks incomplete.', 'err');
  if (!ENDPOINT) return say('Form endpoint not wired up yet.', 'err');

  btn.disabled = true; say('Sending…');
  try {
    const body = new FormData();
    body.append('email', email);
    const res = await fetch(ENDPOINT, { method:'POST', body, headers:{ Accept:'application/json' } });
    if (!res.ok) throw new Error(res.status);
    form.hidden = true;
    document.getElementById('wlDone').hidden = false;
    say('');
  } catch {
    btn.disabled = false;
    say('Something went wrong. Try again in a moment.', 'err');
  }
});
</script>
</body>
</html>
